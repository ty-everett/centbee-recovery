name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Verify native runtime
        run: node -e "if(process.versions.node!=='22.23.4')throw Error(process.versions.node);const z=require('node:zlib');const b=Buffer.from('runtime');if(!z.brotliDecompressSync(z.brotliCompressSync(b)).equals(b))throw Error('Brotli');require('node:crypto').randomBytes(16)"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Verify native runtime
        run: node -e "if(process.versions.node!=='22.23.4')throw Error(process.versions.node);const z=require('node:zlib');const b=Buffer.from('runtime');if(!z.brotliDecompressSync(z.brotliCompressSync(b)).equals(b))throw Error('Brotli');require('node:crypto').randomBytes(16)"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
